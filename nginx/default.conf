limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_pool {
    zone backend_pool 64k;
    server backend:4000 resolve;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Automatic HTTP to HTTPS redirection (Phase 5)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    # SSL Termination (Phase 5)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Phase 7: share API traffic across every backend replica and protect it
    # from short request bursts originating from the same client address.
    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route frontend requests to internal frontend static server
    location / {
        set $frontend_service http://frontend:80;
        proxy_pass $frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
